  feature: coop_mode_selected
  timeout_ms: 2000
  retries: 0
  optional: true
- action: click_feature
  feature: port_battle_button
  timeout_ms: 3000
  retries: 2
- action: click_feature
  feature: battle_start_confirm_yes
  timeout_ms: 1500
  retries: 0
  optional: true
- action: wait_feature
  feature: queue_indicator
  timeout_ms: 20000
  retries: 0
