# 直营服独立配置；初始模板来源和标定要求见本目录 README.md。
client_id: wg_eu
display_name: 直营服 · 欧服（简体中文）
language: zh_cn
reference_resolution:
- 2560
- 1600
notes: 初始模板复制自 cn360，适用于简体中文 2560×1600 基线；未使用直营服实机截图验证，使用前应独立标定。
window:
  process_names:
  - WorldOfWarships.exe
  - WorldOfWarships64.exe
  title_patterns:
  - World of Warships
  - 战舰世界
  require_foreground: true
keys_file: keys.yaml
minimap:
  rect:
  - 0.853125
  - 0.765
  - 1.0
  - 1.0
  border_px: 2
  frame_feature: null
  marker_template: marker/marker.png
  marker_angles: 24
  marker_hsv_lower:
  - 0
  - 0
  - 200
  marker_hsv_upper:
  - 180
  - 60
  - 255
  marker_jump_px: 300
  marker_lost_s: 3
battle_hud:
  hp_bar_region:
  - 0.014
  - 0.737
  - 0.13
  - 0.7665
  hp_fill_hsv_lower:
  - 68
  - 150
  - 150
  hp_fill_hsv_upper:
  - 92
  - 255
  - 255
  hp_fill_zero_ratio: 0.05
  hp_bar_empty_max_ratio: 0.02
  hp_bar_alive_min_ratio: 0.1
  hp_bar_confirm_frames: 2
  hp_bar_evidence_ttl_s: 1.0
  hp_zero_feature: hp_zero_value
  spectator_features: []
  death_banner_feature: death_banner
  result_feature: battle_results
  result_continue_feature: result_continue_battle_button
  result_return_feature: result_return_port_button
camera:
  relative: true
  sensitivity: 1.0
exit:
  menu_key: escape
  menu_open_feature: exit_menu_return_port
  return_port_feature: exit_menu_return_port
  confirm_feature: exit_confirm_yes
  port_feature: port_battle_button
  direct_exit_feature: null
  post_click_wait_ms: 500
state_features:
  PORT:
  - port_indicator
  - port_battle_button
  - coop_mode_selected
  QUEUEING:
  - queue_indicator
  - cancel_queue_button
  LOADING: []
  BATTLE_ACTIVE:
  - battle_hud_indicator
  - hp_bar_present
  - autopilot_indicator
  BATTLE_FINISHED:
  - battle_results
  - result_panel
  - result_continue_battle_button
  - result_return_port_button
  EXIT_MENU_OPEN:
  - exit_menu_return_port
  EXIT_CONFIRMING:
  - exit_confirm_yes
  POST_EXIT_INTERFACE: []
popup_features: []
