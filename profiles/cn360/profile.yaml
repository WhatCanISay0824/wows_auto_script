# 客户端配置：国服 360 客户端（cn360）
# 实现依据：详细设计第 3.2 节、第 12.3 节客户端标定流程
#
# 标定进度（2026-10-30）：已从实机截图（2559×1599）提取 13 个界面模板 + 自身标记模板，
# 见 docs/截图分类与提取结果.md。仍缺：加载界面、ESC 退出菜单、退出确认框、观战界面、
# 回港弹窗、装备页信号旗槽、目标船只卡片；缺失项 validate 会报 file_missing（预期），
# 补齐截图后按 docs/截图标定清单.md 用标定工具生成即可。
#
# 截图/模板均为实机同分辨率（2559×1599）；模板匹配只覆盖 ±5% 缩放，若实际窗口尺寸变化需重采。

client_id: cn360
display_name: 国服 360 客户端
language: zh_cn
reference_resolution: [2560, 1600]   # 游戏客户区实测 2560x1600（截图文件为 2559x1599，归一化区域两者通用）
notes: 部分模板已从 2026-10-30 实机截图提取；其余待标定。

window:
  process_names: [WorldOfWarships.exe]      # 待验证 V01
  title_patterns: ["战舰世界", "World of Warships"]  # 待验证 V01
  require_foreground: true

keys_file: keys.yaml

# 小地图标定（实测 211346 战斗截图）：小地图位于右下角，内容区为深色网格面板
# （不含上方 1~10 数字栏和左侧 A~J 字母栏的外侧？字母在面板内），右下贴边。
minimap:
  rect: [0.798, 0.677, 0.999, 0.994]
  border_px: 2
  frame_feature: null                    # 小地图边框模板不稳定，暂不使用
  marker_template: marker/marker.png     # 自身舰船白色箭头（已从实机截图提取）
  marker_angles: 24
  marker_hsv_lower: [0, 0, 200]          # 白色箭头：低饱和、高亮度
  marker_hsv_upper: [180, 60, 255]
  marker_jump_px: 300
  marker_lost_s: 3

# 战斗 HUD 与死亡判定标定（实测截图）
battle_hud:
  hp_bar_region: [0.026, 0.731, 0.118, 0.758]   # 己方血条绿色填充区域（左下）
  hp_fill_hsv_lower: [68, 150, 150]             # 实测绿色填充 HSV ≈ (80, 190~217, 200~244)
  hp_fill_hsv_upper: [92, 255, 255]
  hp_fill_zero_ratio: 0.05
  spectator_features: []                        # 用户确认：死亡立刻退出，不需要观战界面
  death_banner_feature: death_banner            # 已提取（“您的战舰已被玩家摧毁”）
  result_feature: battle_results                # 已提取（结算页右侧固定分页栏）

camera:
  relative: true        # 视角使用鼠标相对移动（详细设计 8.4）
  sensitivity: 1.0      # 待实机标定

# 退出流程（详细设计 6.1 / 10.2）。状态机消费这些特征，不写死按键与按钮。
# 实测：ESC → 菜单（215424，含“离开战斗”按钮）→ 确认框（215411，是/否/继续战斗）→ 回港。
# menu_open_feature 与 return_port_feature 都指向“离开战斗”按钮（菜单一出现即可点击）。
exit:
  menu_key: escape
  menu_open_feature: exit_menu_return_port
  return_port_feature: exit_menu_return_port
  confirm_feature: exit_confirm_yes
  port_feature: port_battle_button   # 港口页/装备页都有的“加入战斗”按钮，比标签页稳定
  direct_exit_feature: null
  post_click_wait_ms: 500

# 状态识别特征表（详细设计 5.4）。第一个为主判定，其余为辅助；缺失特征会被跳过。
state_features:
  PORT: [port_indicator, port_battle_button, coop_mode_selected, port_equip_tab]
  QUEUEING: [queue_indicator, cancel_queue_button]
  LOADING: []                     # 加载界面模板可缺省：排队结束后直接检测战斗 HUD 进战斗
  BATTLE_ACTIVE: [battle_hud_indicator, hp_bar_present]
  BATTLE_FINISHED: [battle_results, result_panel]
  EXIT_MENU_OPEN: [exit_menu_return_port]
  EXIT_CONFIRMING: [exit_confirm_yes]
  POST_EXIT_INTERFACE: []         # 回港弹窗暂不处理（未知弹窗由异常恢复 ESC 兜底）

# 回港后弹窗特征（暂未截图；先留空，遇未知弹窗由异常恢复 ESC 处理，后续可补）
popup_features: []

# 界面特征模板（详细设计 3.2 / 5.4）。region 为归一化搜索区域 [x1,y1,x2,y2]。
# 已提取：18 个（含 2026-10-30 新补的退出菜单/确认框/装备页/标签页模板）。
features:
  port_indicator:
    template: features/port_indicator.png          # 顶部“港口”标签（实机画面提取）
    region: [0.26, 0.045, 0.42, 0.10]
    threshold: 0.82
  port_battle_button:
    template: features/port_battle_button.png      # 顶部“加入战斗”按钮
    region: [0.40, 0.0, 0.56, 0.06]
    threshold: 0.85
  coop_mode_selected:
    template: features/coop_mode_selected.png      # “联合作战 / 更改战斗模式”模式块
    region: [0.52, 0.0, 0.66, 0.06]
    threshold: 0.82
  battle_start_confirm_panel:
    template: features/battle_start_confirm_panel.png  # 未学习指挥官技能确认框文字
    region: [0.25, 0.52, 0.78, 0.62]
    threshold: 0.78
  battle_start_confirm_yes:
    template: features/battle_start_confirm_yes.png    # 确认框“是”按钮
    region: [0.36, 0.58, 0.56, 0.67]
    threshold: 0.85
  queue_indicator:
    template: features/queue_indicator.png         # “您已加入准备战斗的队列中”
    region: [0.30, 0.15, 0.70, 0.25]
    threshold: 0.80
  cancel_queue_button:
    template: features/cancel_queue_button.png     # “离开队列”按钮
    region: [0.38, 0.89, 0.62, 0.99]
    threshold: 0.85
  battle_hud_indicator:
    template: features/battle_hud_indicator.png    # 顶部 A/B/C/D 占点条
    region: [0.40, 0.02, 0.60, 0.10]
    threshold: 0.85
  hp_bar_present:
    template: features/hp_bar_present.png          # 左下“VII 列宁格勒”血条文字（静态）
    region: [0.0, 0.72, 0.17, 0.80]
    threshold: 0.82
  death_banner:
    template: features/death_banner.png            # “您的战舰已被玩家摧毁”（静态文字）
    region: [0.38, 0.82, 0.74, 0.93]
    threshold: 0.80
  battle_results:
    template: features/battle_results.png          # 结算页顶部分页栏
    region: [0.18, 0.0, 0.82, 0.08]
    threshold: 0.82
  result_panel:
    template: features/result_panel.png            # 结算页“作战任务”小标题
    region: [0.08, 0.53, 0.27, 0.65]
    threshold: 0.82
  result_return_port_button:
    template: features/result_return_port_button.png  # “回到港口”按钮
    region: [0.38, 0.88, 0.64, 0.98]
    threshold: 0.85
  # ---- 实测退出菜单 / 退出确认框（215424 / 215411）----
  exit_menu_return_port:
    template: features/exit_menu_return_port.png      # ESC 菜单里的“离开战斗”按钮
    region: [0.40, 0.36, 0.60, 0.44]
    threshold: 0.85
  exit_confirm_yes:
    template: features/exit_confirm_yes.png           # “离开战斗?” 确认框里的“是”按钮
    region: [0.34, 0.45, 0.48, 0.53]
    threshold: 0.85
  # ---- 实测港口标签页 / 装备页信号旗（210924 / 214644）----
  port_equip_tab:
    template: features/port_equip_tab.png             # 顶部“装备”标签（实机画面提取，未选中态）
    region: [0.34, 0.045, 0.50, 0.10]
    threshold: 0.82
  loadout_signal_flags:
    template: features/loadout_signal_flags.png       # 装备页“信号旗 0/8”（数量为 0 才算空）
    region: [0.38, 0.41, 0.50, 0.47]
    threshold: 0.82

# 开局步骤（实测 UI）：港口 → 点“加入战斗” → 若弹出“未学习技能”确认框点“是” → 等待排队界面
start_sequence:
  - action: wait_feature
    feature: coop_mode_selected
    timeout_ms: 2000
    retries: 0
    optional: true
  - action: click_feature
    feature: port_battle_button
    timeout_ms: 3000
    retries: 2
  - action: click_feature
    feature: battle_start_confirm_yes
    timeout_ms: 1500
    retries: 0
    optional: true
  - action: wait_feature
    feature: queue_indicator
    timeout_ms: 20000
    retries: 0

# 完整开局路径：重试更宽松（实际 UI 与快速路径相同，保留独立配置便于以后扩展）
start_sequence_full:
  - action: click_feature
    feature: port_battle_button
    timeout_ms: 3000
    retries: 3
  - action: click_feature
    feature: battle_start_confirm_yes
    timeout_ms: 2500
    retries: 1
    optional: true
  - action: wait_feature
    feature: queue_indicator
    timeout_ms: 20000
    retries: 0

# 结算界面：等结算稳定后点“回到港口”；之后由 EXITING 状态等待回港
result_sequence:
  - action: wait_feature
    feature: battle_results
    timeout_ms: 60000
    retries: 0
  - action: click_feature
    feature: result_return_port_button
    timeout_ms: 10000
    retries: 2

# 弹窗清理：暂未截图 popup_close_button，先留空；未知弹窗由异常恢复 ESC 兜底。
# 后续若观察到固定奖励/任务弹窗，补模板后在此加入 click_feature 步骤。
popup_sequence: []

# 船只选择：实测港口是底部船只轮播条，没有单独的“船只列表”按钮；
# ShipChecker 直接把光标移到 card_search_region（轮播条）用鼠标滚轮滚动，找到卡片后点击选中，
# 因此不再需要打开列表的步骤。
ship_selection_sequence: []

# 每场战斗前的装备页校验（用户确认：只要求信号旗数量为 0）：
# 点顶部“装备”标签 → 等“信号旗 0/8”特征（数量不为 0 则匹配失败，进入 PAUSED）。
# 校验后不必切回港口页：“加入战斗”按钮在装备页同样存在，直接开局即可。
ship_check_sequence:
  - action: click_feature
    feature: port_equip_tab
    timeout_ms: 3000
    retries: 1
  - action: wait_feature
    feature: loadout_signal_flags
    timeout_ms: 3000
    retries: 0

# 船只校验：ship_card 由运行时的船只卡片模板注册（来自 ships/<ship_id>/card.png）
ship_verify_features: [ship_card]
loadout_verify_features: []   # 信号旗已在 ship_check_sequence 中校验，不再重复检查

# 默认不自动清除已装配的信号旗或加成卡
clear_loadout_sequence: null
