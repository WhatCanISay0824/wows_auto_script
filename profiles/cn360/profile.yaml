# 客户端配置：国服 360 客户端（cn360）
# 实现依据：详细设计第 3.2 节、第 12.3 节客户端标定流程
#
# 状态：骨架已建立，模板图片与坐标全部待实机标定（详细设计第 16 章 V04~V24）。
# 本目录下的 features/*.png、marker/marker.png、ships/<ship_id>/card.png 等
# 文件由标定工具在 M0 阶段从实机截图生成；缺失时 `python -m src.tools.validate`
# 会报错，这是预期行为，不是代码缺陷。

client_id: cn360
display_name: 国服 360 客户端
language: zh_cn
reference_resolution: [2560, 1600]   # 模板采集时的窗口客户区尺寸
notes: 待实机标定。所有区域坐标为归一化值，按 2560×1600 采集。

window:
  process_names: [WorldOfWarships.exe]      # 待验证 V01
  title_patterns: ["战舰世界", "World of Warships"]  # 待验证 V01
  require_foreground: true

keys_file: keys.yaml

# 小地图标定（详细设计 5.6/5.7）。rect 为小地图内容区的归一化矩形，不含边框；
# border_px 为内容区四周需要裁掉的像素宽度。
minimap:
  rect: [0.86, 0.03, 0.99, 0.24]       # 待验证 V08/V09：位置、大小、是否整图、是否北向固定
  border_px: 2
  frame_feature: minimap_frame          # 可选，用于启动时精确定位小地图
  marker_template: marker/marker.png    # 标定工具从实机截图截取的自身标记模板
  marker_angles: 24                     # 多角度模板数量（0~345 度，每 15 度）
  marker_hsv_lower: [0, 0, 200]         # 待验证 V10：自身标记颜色范围
  marker_hsv_upper: [180, 60, 255]
  marker_jump_px: 300                   # 连续跳变超过该像素视为跟踪失效
  marker_lost_s: 3                      # 连续丢失多久标记为 lost

# 战斗 HUD 与死亡判定标定（详细设计 5.9）
battle_hud:
  hp_bar_region: [0.02, 0.86, 0.20, 0.93]   # 待验证 V11：己方血条位置
  hp_fill_hsv_lower: [35, 80, 80]           # 待验证 V11：血条填充颜色范围（初始假设为绿色）
  hp_fill_hsv_upper: [95, 255, 255]
  hp_fill_zero_ratio: 0.03                  # 填充像素比例低于该值视为血量归零
  spectator_features: [spectator_indicator] # 待验证 V13
  death_banner_feature: death_banner        # 待验证 V12
  result_feature: battle_results            # 待验证 V17

camera:
  relative: true        # 视角使用鼠标相对移动（详细设计 8.4）
  sensitivity: 1.0      # 待验证 V20：实机标定，动作可见但不影响观察

# 退出流程（详细设计 6.1 / 10.2）。状态机消费这些特征，不写死按键与按钮。
exit:
  menu_key: escape
  menu_open_feature: exit_menu_panel
  return_port_feature: exit_menu_return_port
  confirm_feature: exit_confirm_yes
  port_feature: port_indicator
  direct_exit_feature: null        # 若客户端提供“直接离开战斗”按钮，填特征名
  post_click_wait_ms: 500

# 状态识别特征表（详细设计 5.4）。第一个为主判定，其余为辅助；缺失时用代码内置默认表。
state_features:
  PORT: [port_indicator, port_battle_button, port_mode_selector, coop_mode_selected]
  QUEUEING: [queue_indicator, cancel_queue_button]
  LOADING: [loading_indicator, loading_tip_area]
  BATTLE_ACTIVE: [battle_hud_indicator, hp_bar_present, minimap_frame]
  BATTLE_FINISHED: [battle_results, result_panel]
  EXIT_MENU_OPEN: [exit_menu_panel, exit_menu_return_port]
  EXIT_CONFIRMING: [exit_confirm_dialog, exit_confirm_yes]
  POST_EXIT_INTERFACE: [popup_close_button, reward_panel, mission_panel]

# 回港后可能出现的弹窗面板特征（详细设计 5.10）
popup_features: [reward_panel, mission_panel]

# 界面特征模板（详细设计 3.2 / 5.4）。
# region 为归一化搜索区域 [x1, y1, x2, y2]；scales 为多尺度匹配范围。
features:
  port_indicator:
    template: features/port_indicator.png
    region: [0.00, 0.00, 0.35, 0.12]
    threshold: 0.85
  port_battle_button:
    template: features/port_battle_button.png
    region: [0.55, 0.82, 0.98, 0.99]
    threshold: 0.85
  port_mode_selector:
    template: features/port_mode_selector.png
    region: [0.55, 0.70, 0.98, 0.85]
    threshold: 0.85
  coop_mode_selected:
    template: features/coop_mode_selected.png
    region: [0.55, 0.70, 0.98, 0.85]
    threshold: 0.85
  port_ship_panel_button:
    template: features/port_ship_panel_button.png
    region: [0.00, 0.78, 0.22, 0.99]
    threshold: 0.85
  queue_indicator:
    template: features/queue_indicator.png
    region: [0.30, 0.35, 0.70, 0.75]
    threshold: 0.85
  cancel_queue_button:
    template: features/cancel_queue_button.png
    region: [0.30, 0.70, 0.70, 0.90]
    threshold: 0.85
  loading_indicator:
    template: features/loading_indicator.png
    region: [0.30, 0.40, 0.70, 0.70]
    threshold: 0.85
  loading_tip_area:
    template: features/loading_tip_area.png
    region: [0.10, 0.78, 0.90, 0.98]
    threshold: 0.85
  battle_hud_indicator:
    template: features/battle_hud_indicator.png
    region: [0.00, 0.85, 0.25, 0.99]
    threshold: 0.85
  hp_bar_present:
    template: features/hp_bar_present.png
    region: [0.02, 0.86, 0.20, 0.93]
    threshold: 0.85
  minimap_frame:
    template: features/minimap_frame.png
    region: [0.84, 0.01, 0.995, 0.26]
    threshold: 0.85
  death_banner:
    template: features/death_banner.png
    region: [0.25, 0.30, 0.75, 0.70]
    threshold: 0.80
  spectator_indicator:
    template: features/spectator_indicator.png
    region: [0.45, 0.00, 0.99, 0.16]
    threshold: 0.85
  battle_results:
    template: features/battle_results.png
    region: [0.25, 0.10, 0.75, 0.45]
    threshold: 0.85
  result_panel:
    template: features/result_panel.png
    region: [0.10, 0.10, 0.90, 0.90]
    threshold: 0.85
  result_return_port_button:
    template: features/result_return_port_button.png
    region: [0.60, 0.82, 0.99, 0.99]
    threshold: 0.85
  exit_menu_panel:
    template: features/exit_menu_panel.png
    region: [0.25, 0.15, 0.75, 0.85]
    threshold: 0.85
  exit_menu_return_port:
    template: features/exit_menu_return_port.png
    region: [0.25, 0.55, 0.75, 0.90]
    threshold: 0.85
  exit_confirm_dialog:
    template: features/exit_confirm_dialog.png
    region: [0.30, 0.35, 0.70, 0.65]
    threshold: 0.85
  exit_confirm_yes:
    template: features/exit_confirm_yes.png
    region: [0.50, 0.55, 0.80, 0.70]
    threshold: 0.85
  popup_close_button:
    template: features/popup_close_button.png
    region: [0.85, 0.05, 0.99, 0.20]
    threshold: 0.85
  reward_panel:
    template: features/reward_panel.png
    region: [0.15, 0.10, 0.85, 0.90]
    threshold: 0.85
  mission_panel:
    template: features/mission_panel.png
    region: [0.15, 0.10, 0.85, 0.90]
    threshold: 0.85

# 开局步骤：快速路径（详细设计 10.6）。快速路径失败时自动改用 start_sequence_full。
start_sequence:
  - action: wait_feature
    feature: coop_mode_selected
    timeout_ms: 2000
    retries: 0
  - action: click_feature
    feature: port_battle_button
    timeout_ms: 3000
    retries: 1
  - action: wait_feature
    feature: queue_indicator
    timeout_ms: 15000
    retries: 0

# 完整开局路径：打开战斗模式选择 → 选择联合作战 → 点击开始
start_sequence_full:
  - action: click_feature
    feature: port_mode_selector
    timeout_ms: 3000
    retries: 1
  - action: click_feature
    feature: coop_mode_selected
    timeout_ms: 5000
    retries: 1
  - action: click_feature
    feature: port_battle_button
    timeout_ms: 3000
    retries: 1
  - action: wait_feature
    feature: queue_indicator
    timeout_ms: 15000
    retries: 0

# 结算界面：等待结算稳定后点击返回港口；之后由 EXITING 状态等待回港
result_sequence:
  - action: wait_feature
    feature: battle_results
    timeout_ms: 60000
    retries: 0
  - action: click_feature
    feature: result_return_port_button
    timeout_ms: 10000
    retries: 2

# 弹窗清理：代码按 popup_features 循环识别，每轮执行一次本序列，最多 5 轮
popup_sequence:
  - action: click_feature
    feature: popup_close_button
    timeout_ms: 3000
    retries: 1

# 船只选择：打开船只列表；之后的滚动查找由 ShipChecker 按 ship.yaml 的
# scroll_direction / scroll_clicks / max_scrolls 循环执行（详细设计 6.8）
ship_selection_sequence:
  - action: click_feature
    feature: port_ship_panel_button
    timeout_ms: 3000
    retries: 1

# 船只与空装备校验：ship_card 由运行时的船只卡片模板注册；
# loadout_* 由 ships/<ship_id>/loadout/ 下的空槽模板注册（详细设计 6.8）
ship_verify_features: [ship_card]
loadout_verify_features: [loadout_signal_flags, loadout_economic_bonus]

# 默认不自动清除已装配的信号旗或加成卡（详细设计 6.8）
clear_loadout_sequence: null
