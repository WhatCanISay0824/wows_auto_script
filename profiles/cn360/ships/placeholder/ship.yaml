# 船只配置（详细设计 3.2 / 6.8）
# 状态：占位配置。M0 阶段用标定工具从港口实机截图中截取 card.png 与 loadout/ 空信号旗槽模板，
# 并确认空槽外观后替换本文件。当前 card.png 不存在，validate 会报错，属预期。
#
# 用户确认的装备口径（2026-10-30）：
# - 只校验“信号旗数量为 0”，其他装备不检查；
# - 装备界面左侧的配件/升级不要读、不要点、不要改（脚本不碰左侧任何控件）；
# - 不售卖、不出售、不消耗任何船只或装备；脚本只做船只列表选择与卡片点击。

ship_id: placeholder
display_name: 占位船只（待选定目标船后替换）
card_template: card.png
card_search_region: [0.0, 0.80, 1.0, 1.0]   # 港口底部船只轮播条（实测 UI）
loadout_preset_feature: null  # 不使用预设（预设可能包含左侧配件/升级，禁止启用）
max_scrolls: 20               # 船只列表最多滚动次数（鼠标滚轮滚动，不用拖动滚动条）
scroll_direction: down        # 船只列表滚动方向：down=向下滚（待实机确认轮播滚动方向）
scroll_clicks: 1              # 每次滚动格数（MOUSE_WHEEL 1 格 = WHEEL_DELTA）

# 空装备槽校验：只要求信号旗数量为 0（用户确认口径）；左侧配件/升级不参与校验。
# 全部配置的槽位都命中才允许开始战斗（详细设计 6.8）。
loadout_slots:
  - slot_id: signal_flags
    name: 信号旗槽位（数量需为 0）
    empty_template: loadout/signal_flags_empty.png

notes: 占位配置；实机标定后替换 card.png 与 loadout/signal_flags_empty.png。只校验信号旗为 0，不触碰左侧配件。
